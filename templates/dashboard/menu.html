{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <h2 class="text-center mb-5 fade-in-up"><i class="fa-solid fa-grid-2 me-2"></i>Доступные функции</h2>
    <div class="row g-4 justify-content-center">
        {% for func in functions %}
        <div class="col-md-6 col-lg-4 fade-in-up menu-card" data-delay="{{ forloop.counter0 }}">
            <a href="{% url func.url %}" class="text-decoration-none">
                <div class="glass-card p-5 text-center h-100">
                    <i class="fa-solid {{ func.icon }} fa-3x text-primary mb-3"></i>
                    <h4>{{ func.name }}</h4>
                    <p class="text-muted">{{ func.description }}</p>
                </div>
            </a>
        </div>
        {% empty %}
        <p>Нет доступных функций.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.menu-card').forEach(function(card) {
        const delay = card.getAttribute('data-delay');
        card.style.animationDelay = (delay * 0.2) + 's';
    });
});
</script>
{% endblock %}
