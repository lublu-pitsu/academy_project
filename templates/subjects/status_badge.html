{% if status == 'passed' %}
    <span class="badge bg-success"><i class="fa-solid fa-check-circle me-1"></i>{{ display }}</span>
{% elif status == 'failed' %}
    <span class="badge bg-danger"><i class="fa-solid fa-exclamation-circle me-1"></i>{{ display }}</span>
{% else %}
    <span class="badge bg-warning text-dark"><i class="fa-solid fa-spinner me-1"></i>{{ display }}</span>
{% endif %}
